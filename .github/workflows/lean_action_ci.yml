name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to check out the repository.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: "false"  # `lake test` builds what it needs; skip the full book.
          test: "true"

  # Every chapter also ships as a standalone pair of files a reader can
  # open and work in. The book compiling says nothing about whether those
  # do — they are reassembled from the chapter, and a dropped `open` or a
  # reordered declaration only shows up when the file itself is
  # elaborated. Each has its own header, so each needs its own process;
  # that makes this slow, which is why it runs alongside `test` rather
  # than inside it.
  exercises:
    name: Check the exercise files
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to check out the repository.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: "false"
          test: "false"
      - name: Elaborate every generated exercise and solution file
        run: lake exe checkexercises --jobs 4

  # Render the book and deploy to GitHub Pages. Only runs on pushes to
  # `main`, gated on the checks above, so neither a broken render nor a
  # broken download lands on the live site.
  deploy-book:
    name: Build and deploy book
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, exercises]
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to check out the repository.
      pages: write # Required to deploy to GitHub Pages.
      id-token: write # Required for the OIDC token used by deploy-pages.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          test: "false"  # Already covered by the `test` job.
      - name: Render book
        run: lake exe napkin --output _site
      # In-book links are written relative to the site root, so a wrong one
      # still builds and renders — it just 404s. Catch that before deploying.
      - name: Check internal links
        run: lake exe linkcheck _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site/html-multi
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
